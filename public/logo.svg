<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    
    <!-- Gold/Yellow Gradient for Yarn -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop Shadow for Yarn Ball -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <dropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" rx="48" />

  <!-- Grid Accents to match KNITArchitect's architectural/grid theme -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 8" opacity="0.3">
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <circle cx="256" cy="190" r="110" fill="none" stroke-width="0.5" />
  </g>

  <!-- Stylized Knitted Yarn Ball -->
  <g filter="url(#shadow)">
    <!-- Main Ball Outline (Circular) -->
    <circle cx="256" cy="190" r="80" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.15" />

    <!-- Group of Curved Yarn Strands / Knit Loops -->
    <g stroke="url(#goldGradient)" stroke-width="10" stroke-linecap="round" fill="none">
      <!-- Segment Group A: Curving top-left to bottom-right -->
      <path d="M 196 140 A 80 80 0 0 1 316 140" />
      <path d="M 186 170 A 80 80 0 0 1 326 170" />
      <path d="M 186 200 A 80 80 0 0 1 326 200" />
      <path d="M 196 230 A 80 80 0 0 1 316 230" />

      <!-- Segment Group B: Overlapping vertical wrapping (Basketweave / Knitted Ball Effect) -->
      <path d="M 216 120 A 75 75 0 0 0 216 260" stroke-width="9" />
      <path d="M 256 110 A 75 75 0 0 0 256 270" stroke-width="11" />
      <path d="M 296 120 A 75 75 0 0 0 296 260" stroke-width="9" />

      <!-- Segment Group C: Diagonal structural wraps -->
      <path d="M 181 160 C 210 110, 302 110, 331 160" stroke-width="8" opacity="0.9" />
      <path d="M 181 220 C 210 270, 302 270, 331 220" stroke-width="8" opacity="0.9" />

      <!-- Inner accent mini loops to simulate woven center -->
      <path d="M 230 190 Q 256 160 282 190" stroke-width="6" />
      <path d="M 230 190 Q 256 220 282 190" stroke-width="6" />
    </g>
  </g>

  <!-- Typography: Modern Geometric Sans-Serif -->
  <!-- "KNIT" - Bold, sleek, clean -->
  <text 
    x="256" 
    y="360" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="68" 
    font-weight="900" 
    letter-spacing="12"
  >KNIT</text>

  <!-- "ARCHITECT" - Lighter, elegant, wider spacing -->
  <text 
    x="256" 
    y="415" 
    text-anchor="middle" 
    fill="#94a3b8" 
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="30" 
    font-weight="300" 
    letter-spacing="18"
  >ARCHITECT</text>
</svg>
